<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drop Studio Productions</title>

    <!-- Preload da logo (imagem crítica do Hero) -->
    <link rel="preload" as="image" href="/logo.webp" type="image/webp" />

    <!-- Preload da fonte Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Aplica o tema salvo (claro/escuro) antes da página renderizar, evitando "flash" -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('drop-studio-theme') === 'light') {
            document.documentElement.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/react-app/main.tsx"></script>
  </body>
</html>
